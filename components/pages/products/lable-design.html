<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label - <?= e($name) ?></title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f6f6f6;
    }

    /* Responsive center wrapper */
    .wrap {
      min-height: 100svh;               /* better on mobile than 100vh */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Responsive label card */
    .label {
      width: min(92vw, 320px);          /* responsive width */
      padding: clamp(12px, 3vw, 18px);  /* responsive padding */
      text-align: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .name {
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .sku {
      font-size: clamp(10px, 2.8vw, 11px);
      color: #555;
      margin: 8px 0;
      font-family: "Courier New", monospace;
      padding: 6px;
      border-radius: 6px;
      background: #f3f3f3;
      overflow-wrap: anywhere;
    }

    /* Barcode container + responsive SVG */
    .barcode-wrap {
      margin: 10px 0;
      width: 100%;
      overflow: hidden;
    }

    #barcode {
      width: 100%;
      height: auto;
      display: block;
    }

    .price {
      margin-top: 8px;
      font-size: clamp(13px, 3.4vw, 14px);
      font-weight: 800;
    }

    .price span {
      font-size: clamp(11px, 3vw, 12px);
      font-weight: 500;
    }

    #err {
      margin-top: 10px;
      color: red;
      font-size: 12px;
    }

    /* Print-friendly */
    @media print {
      body { background: #fff; }
      .wrap { min-height: auto; padding: 0; }
      .label {
        box-shadow: none;
        border-radius: 0;
        width: 100%;
        max-width: 3.5in;
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="label">
      <div class="name"><?= e($name) ?></div>

      <div class="sku"><?= e($sku) ?></div>

      <div class="barcode-wrap">
        <svg id="barcode"></svg>
      </div>

      <div class="price"><span>LKR</span> <?= e($price) ?></div>

      <div id="err"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    window.addEventListener('load', function () {
      try {
        if (!window.JsBarcode) throw new Error("JsBarcode not loaded");

        // Make barcode responsive: render, then let SVG scale via CSS width:100%
        JsBarcode('#barcode', <?= json_encode($sku) ?>, {
          format: 'CODE128',
          displayValue: true,
          fontSize: 12,
          height: 48,
          margin: 0,
          width: 2  // bar width (tweak if needed)
        });
      } catch (e) {
        console.error(e);
        document.getElementById('err').textContent = "Barcode failed. Check console.";
      }

      setTimeout(function () { window.print(); }, 300);
    });
  </script>
</body>

</html>
